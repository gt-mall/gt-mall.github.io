name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Install, check, build and upload
        uses: withastro/action@v6
        env:
          WEBSITE_URL: ${{ steps.pages.outputs.origin }}
          WEBSITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        with:
          node-version: 24
          build-cmd: |
            pnpm run check
            pnpm run build

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
